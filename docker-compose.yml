services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: trading_bot
      POSTGRES_USER: trading_bot
      POSTGRES_PASSWORD: trading_bot
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trading_bot -d trading_bot']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trading_bot:trading_bot@postgres:5432/trading_bot?schema=public
    ports:
      - '3000:3000'

volumes:
  postgres_data:
